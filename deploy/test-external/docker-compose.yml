# temporary test setup — external test deploy for newapi.aigava.ai
# Ports published on the host: 8080 (HTTP) and 8443 (HTTPS) via Caddy only.
# Do not publish the usual privileged web ports; Caddy is the sole public entry.
#
# Usage (from this directory):
#   cp .env.example .env
#   cp secrets/mysql_root.env.example secrets/mysql_root.env
#   chmod 600 .env secrets/mysql_root.env
#   # edit CHANGE_ME values, then:
#   docker compose up -d
#
# See DEPLOY_TEST.md for DNS, TLS, and access notes.

services:
  caddy:
    image: caddy:2-alpine
    container_name: new-api-caddy
    restart: unless-stopped
    # temporary test setup: public listeners only on 8080 / 8443
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      - new-api-test

  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    # temporary test setup: keep app on internal :3000 only.
    # Host HTTP/HTTPS is handled by Caddy (8080 / 8443 → new-api:3000).
    # No host port publish here, so 8080 is not double-bound.
    expose:
      - "3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    # App must NOT load mysql root secret
    env_file:
      - .env
    environment:
      # App DB user is newapi only (privileges limited to new-api DB).
      - SQL_DSN=${MYSQL_USER:-newapi}:${MYSQL_PASSWORD}@tcp(mysql:3306)/new-api?parseTime=true
      # temporary test setup: no Redis (saves RAM on 2C/2G); in-memory cache only
      - MEMORY_CACHE_ENABLED=true
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-test-1
      # temporary test setup: HTTP :8080 — Secure cookies would drop refresh and expire ~15m
      - SESSION_COOKIE_SECURE=false
      # Two independent fixed secrets (do not reuse across envs; keep stable on this host)
      - SESSION_SECRET=c6592a7b44fe2aff6adb3bd3c56e0421011203000a215f88269759bc755e550a
      - CRYPTO_SECRET=6480ee931d08711bf351379eed6d12077ed79cde698e46fa15d8760ec899b506
      # Trust Docker bridge / private ranges so Caddy-forwarded client IP works
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - new-api-test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.0
    container_name: new-api-mysql
    restart: unless-stopped
    # temporary test setup: cap MySQL so a 2G host is not OOM'd
    mem_limit: 512m
    env_file:
      - .env
      # Root password only here (chmod 600). Injected into this container only.
      # Do not also put MYSQL_ROOT_PASSWORD in project .env — keep it split.
      - ./secrets/mysql_root.env
    environment:
      MYSQL_DATABASE: new-api
      MYSQL_USER: ${MYSQL_USER:-newapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env — replace CHANGE_ME}
      # MYSQL_ROOT_PASSWORD comes from secrets/mysql_root.env via env_file above
      # Root only from inside the mysql container (docker exec), not from app network
      MYSQL_ROOT_HOST: localhost
    # temporary test setup: low-memory MySQL knobs for small traffic
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_buffer_pool_size=128M
      - --max_connections=50
      - --performance_schema=OFF
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - new-api-test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  new-api-test:
    driver: bridge
